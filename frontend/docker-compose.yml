# Docker Compose para ambiente de desenvolvimento
# Hot reload habilitado via volume mount

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Monta código fonte para hot reload
      - .:/app
      # Evita sobrescrever node_modules do container
      - /app/node_modules
    environment:
      - VITE_API_URL=https://localhost:7100
      # Habilita polling para hot reload funcionar com Docker
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

